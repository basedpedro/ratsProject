# Nginx do rats pm. Instalar:
#   cp deploy/nginx.conf /etc/nginx/sites-available/ratsdev-pm
#   ln -s /etc/nginx/sites-available/ratsdev-pm /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d project.ratsdev.tech
# O certbot acrescenta o HTTPS e o redirecionamento de http para https.

server {
    listen 80;
    server_name project.ratsdev.tech;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Arquivos com hash no nome podem ficar em cache para sempre.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
